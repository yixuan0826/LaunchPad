[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rin-launcher"
version = "1.0.0"
description = "类似希沃桌面助手的启动台应用 - 基于 Python + RinUI (QML)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "PyYAML>=6.0.1",
    "darkdetect~=0.8.0",
    "pynput>=1.7.6",
    "watchdog>=3.0.0",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.1.0"]
dev = ["pytest>=7.4.0", "pytest-qt>=4.2.0", "ruff>=0.1.0"]

[project.gui-scripts]
rin-launcher = "rin_launcher.main:main"

[tool.setuptools.packages.find]
include = ["rin_launcher*"]

[tool.ruff]
line-length = 100
target-version = "py310"
